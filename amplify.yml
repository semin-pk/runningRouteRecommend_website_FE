version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --include=dev --include=optional
        - npm --prefix route-agent/frontend ci --include=dev --include=optional
    build:
      commands:
        - npm run build
        - node scripts/configure-amplify-agent.mjs
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - route-agent/frontend/node_modules/**/*
